<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="Flex.css">
</head>

<body>
    <h1>Flexbox</h1>
    <center>
        <div id="container">
            <div class="divcol" id="red" style="background-color: red;">Red</div>
            <div class="divcol" id="pink" style="background-color: pink;">Pink</div>
            <div class="divcol" id="yellow" style="background-color: yellow;">yellow</div>
            <div class="divcol" id="brown" style="background-color: brown;">Brown</div>
            <div class="divcol" id="green" style="background-color: green;">Green</div>
            <div class="divcol" id="Purple" style="background-color: Purple;">Purple</div>
            <div class="divcol" id="orange" style="background-color: orange;">Orange</div>
            <div class="divcol" id="blue" style="background-color: rgb(63, 128, 249);">Blue</div>
            <div class="divcol" id="grey" style="background-color: grey;">Grey</div>
        </div>
    </center>

</html>
