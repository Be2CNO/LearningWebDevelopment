<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <h1>Learning to make forms using bootstrap</h1>
    <div class="container">
        <div class="mb-3">
            <label for="Emaill" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="Emaill" aria-describedby="emailHelp">
            <div id="emailHelp" class="form-text">We'll never share your email with anyone.</div>
        </div>
        <div class="mb-3">
            <label for="pswd" class="form-label">Password</label>
            <input type="password" class="form-control" id="pswd">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="checkme">
            <label for="checkme" class="form-check-label">check me out!!</label>
        </div>
        <button class="btn btn-outline-dark">Submit</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
