<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <h1>Learning to make forms using bootstrap</h1>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="Emaill" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="Emaill" placeholder="Enter Your Email Address"
                        aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text">We'll never share your email with anyone.</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="pswd" class="form-label">Password</label>
                    <input type="password" class="form-control" id="pswd" placeholder="Enter Your Password">
                </div>
            </div>
        </div>
        <div class="mb-3">
            <select class="form-select form-select-lg" aria-label="Default select example">
                <option selected>Open The Menu Do Your Selection</option>
                <option value="1">One</option>
                <option value="2>El</option>
                <option value=" 3">Hop</option>
                <option value="3">King Steve</option>
            </select>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="checkme">
            <label for="checkme" class="form-check-label">check me out!!</label>
        </div>
        <button class="btn btn-outline-dark">Submit</button>
        <hr>
        <br>
    </div>
    <h2>Checkboxes & Radio Buttons In Bootstrap</h2>
    <br>
    <div class="container">
        <h4>Checkbox</h4>
        <br>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="cheek">
            <label for="cheek" class="form-check-label">
                Check Me!!
            </label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="cheek2">
            <label for="cheek2" class="form-check-label">
                Checked Me :)
            </label>
        </div>
        <br>
        <h4>Radio Buttons</h4>
        <div class="form-check">
            <input type="radio" class="form-check-input" id="radeeo">
            <label for="radeeo" class="form-check-label">
                God Of War III
            </label>
        </div>
        <div class="form-check">
            <input type="radio" class="form-check-input" id="rad2">
            <label for="rad2" class="form-check-label">
                Cod Of Duty MW3
            </label>
        </div>
        <br>
        <hr>
        <h2>Switches In Bootstrap</h2>
        <div class="form-check form-switch">
            <div class="form-text">Do You Agree With Our T/C??</div>
            <input type="checkbox" role="switch" id="swt1" class="form-check-input">
            <label for="swt1" class="form-check-label">
                Yes/No
            </label>
        </div>
        <button class="btn btn-outline-dark">Submit</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
